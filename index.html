<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Our Family Story</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌳</text></svg>">
    <link rel="stylesheet" href="styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&family=Lora:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&display=swap" rel="stylesheet">

    <!-- Firebase SDK -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.8.0/firebase-app.js";
        import { getFirestore, collection, doc, getDocs, setDoc, deleteDoc, onSnapshot, query, orderBy } from "https://www.gstatic.com/firebasejs/11.8.0/firebase-firestore.js";
        import { getStorage, ref as storageRef, uploadBytes, getDownloadURL } from "https://www.gstatic.com/firebasejs/11.8.0/firebase-storage.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDPQ6vtC5kjNPKbaWLmCIMSbH0dGzhSiZk",
            authDomain: "gioielli-family-tree-project.firebaseapp.com",
            projectId: "gioielli-family-tree-project",
            storageBucket: "gioielli-family-tree-project.firebasestorage.app",
            messagingSenderId: "427631593938",
            appId: "1:427631593938:web:b4de2f3c114ef21627200b"
        };

        const firebaseApp = initializeApp(firebaseConfig);
        const db = getFirestore(firebaseApp);
        const storage = getStorage(firebaseApp);

        // Make Firebase available globally
        window.firebaseDb = db;
        window.firebaseCollection = collection;
        window.firebaseDoc = doc;
        window.firebaseGetDocs = getDocs;
        window.firebaseSetDoc = setDoc;
        window.firebaseDeleteDoc = deleteDoc;
        window.firebaseOnSnapshot = onSnapshot;
        window.firebaseQuery = query;
        window.firebaseOrderBy = orderBy;
        window.firebaseStorage = storage;
        window.firebaseStorageRef = storageRef;
        window.firebaseUploadBytes = uploadBytes;
        window.firebaseGetDownloadURL = getDownloadURL;

        window.dispatchEvent(new Event('firebase-ready'));
    </script>
</head>
<body>
    <div id="app">
        <!-- Navigation -->
        <nav class="site-nav" id="siteNav">
            <a href="#/" class="nav-logo">Our Family Story</a>
            <div class="nav-links">
                <a href="#/stories" class="nav-link">Stories</a>
                <a href="#/family" class="nav-link">Family</a>
            </div>
        </nav>

        <!-- Main content rendered by app.js -->
        <main id="mainContent">
            <div class="loading-state">
                <div class="loading-spinner"></div>
                <p>Loading stories...</p>
            </div>
        </main>
    </div>

    <!-- Story Editor Modal -->
    <div class="modal-overlay" id="storyModal">
        <div class="modal-content story-editor">
            <div class="modal-header">
                <h2 id="storyModalTitle">Add Story</h2>
                <button class="modal-close" onclick="app.closeStoryModal()">&times;</button>
            </div>
            <form id="storyForm" onsubmit="app.handleStorySubmit(event)">
                <div class="form-group">
                    <label for="storyTitle">Story Title</label>
                    <input type="text" id="storyTitle" placeholder="e.g., The Crossing, Sunday Dinners on 43rd Street" required>
                </div>
                <div class="form-group">
                    <label for="storyDate">When (year, decade, or date)</label>
                    <input type="text" id="storyDate" placeholder="e.g., 1904, 1950s, Summer 1962">
                </div>
                <div class="form-group">
                    <label for="storyLocation">Where</label>
                    <input type="text" id="storyLocation" placeholder="e.g., Santa Maria Capua Vetere, Italy">
                </div>
                <div class="form-group">
                    <label for="storyNarrative">The Story</label>
                    <textarea id="storyNarrative" rows="8" placeholder="Tell the story in your own words..."></textarea>
                </div>
                <div class="form-group">
                    <label for="storyCoverPhoto">Cover Photo</label>
                    <input type="file" id="storyCoverPhoto" accept="image/*">
                    <div id="coverPhotoPreview" class="photo-preview"></div>
                </div>
                <div class="form-group">
                    <label for="storyAudio">Audio Recording</label>
                    <input type="file" id="storyAudio" accept="audio/*">
                    <div class="form-row">
                        <div class="form-group form-group-half">
                            <label for="storyToldBy">Told by</label>
                            <input type="text" id="storyToldBy" placeholder="e.g., Uncle Frank">
                        </div>
                        <div class="form-group form-group-half">
                            <label for="storyRecordedBy">Recorded by</label>
                            <input type="text" id="storyRecordedBy" placeholder="e.g., Brian">
                        </div>
                    </div>
                </div>
                <div class="form-group">
                    <label>People in this story</label>
                    <div id="storyPeoplePicker" class="people-picker"></div>
                </div>
                <input type="hidden" id="storyEditId">
                <div class="form-actions">
                    <button type="button" class="btn btn-secondary" onclick="app.closeStoryModal()">Cancel</button>
                    <button type="submit" class="btn btn-primary">Save Story</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Person Editor Modal -->
    <div class="modal-overlay" id="personModal">
        <div class="modal-content person-editor">
            <div class="modal-header">
                <h2 id="personModalTitle">Add Person</h2>
                <button class="modal-close" onclick="app.closePersonModal()">&times;</button>
            </div>
            <form id="personForm" onsubmit="app.handlePersonSubmit(event)">
                <div class="form-group">
                    <label for="personName">Full Name</label>
                    <input type="text" id="personName" required>
                </div>
                <div class="form-row">
                    <div class="form-group form-group-half">
                        <label for="personBirthDate">Born</label>
                        <input type="text" id="personBirthDate" placeholder="e.g., 1881-11-21 or 1880s">
                    </div>
                    <div class="form-group form-group-half">
                        <label for="personDeathDate">Died</label>
                        <input type="text" id="personDeathDate" placeholder="Leave blank if living">
                    </div>
                </div>
                <div class="form-group">
                    <label for="personBirthPlace">Birthplace</label>
                    <input type="text" id="personBirthPlace" placeholder="e.g., Santa Maria Capua Vetere, Italy">
                </div>
                <div class="form-group">
                    <label for="personPhoto">Photo</label>
                    <input type="file" id="personPhoto" accept="image/*">
                    <div id="personPhotoPreview" class="photo-preview"></div>
                </div>
                <div class="form-group">
                    <label for="personBiography">About them</label>
                    <textarea id="personBiography" rows="4" placeholder="A few sentences about this person..."></textarea>
                </div>
                <div class="form-group">
                    <label for="personBranch">Family Branch</label>
                    <input type="text" id="personBranch" placeholder="e.g., Gioielli, Brennan, Miller">
                </div>
                <div class="form-group">
                    <label>Parents</label>
                    <div class="form-row">
                        <select id="personFather" class="form-group-half"><option value="">Father...</option></select>
                        <select id="personMother" class="form-group-half"><option value="">Mother...</option></select>
                    </div>
                </div>
                <div class="form-group">
                    <label>Spouse(s)</label>
                    <div id="spousePicker" class="people-picker"></div>
                </div>
                <div class="form-group">
                    <label>Life Events <span style="font-weight:400;color:var(--text-muted)">(baptism, military, immigration, etc.)</span></label>
                    <div id="eventsEditor" class="events-editor"></div>
                    <button type="button" class="btn btn-secondary btn-small" style="margin-top:8px" onclick="app.addEventRow()">+ Add Event</button>
                </div>
                <div class="form-group">
                    <label>Additional Photos</label>
                    <div id="photosEditor" class="photos-editor"></div>
                    <div class="form-row" style="margin-top:8px;align-items:flex-end">
                        <div class="form-group-half">
                            <input type="file" id="additionalPhoto" accept="image/*">
                        </div>
                        <div class="form-group-half">
                            <input type="text" id="additionalPhotoCaption" placeholder="Caption (optional)">
                        </div>
                    </div>
                    <button type="button" class="btn btn-secondary btn-small" style="margin-top:8px" onclick="app.addPhotoToEditor()">+ Add Photo</button>
                </div>
                <input type="hidden" id="personEditId">
                <div class="form-actions">
                    <button type="button" class="btn btn-secondary" onclick="app.closePersonModal()">Cancel</button>
                    <button type="submit" class="btn btn-primary">Save Person</button>
                </div>
            </form>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
